<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store App</title>
  </head>
  <body>
    <h1>Store</h1>

    <form id="productForm">
      <input type="text" id="name" placeholder="Product name" /><br />
      <input type="text" id="desc" placeholder="Product description" /><br />
      <input type="number" id="price" placeholder="Product price" /><br />
      <input type="text" id="imgURL" placeholder="Product img(url)" /><br /><br />

      <button type="button" onclick="add_product()">Add product</button>
    </form>
    
    <button type="button" onclick="get_products()">Get products</button>

    <table id="productsTable" border="1">
      <thead>
        <tr>
          <th>Назва</th>
          <th>Опис</th>
          <th>Ціна</th>
          <th>Адреса продавця</th>
          <th>Дата створення</th>
          <th>Фото</th>
        </tr>
      </thead>
      <tbody id="productsList">
      </tbody>
    </table>

    <template id="productRowTemplate">
      <tr>
        <td class="name"></td>
        <td class="desc"></td>
        <td><span class="price"></span>$</td>
        <td class="address"></td>
        <td class="timestamp"></td>
        <td><img src="" class="imgURL"/></td>
      </tr>
    </template>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.17.0/ethers.umd.min.js"></script>
    <script src="./scripts/contract_abi.js"></script>
    <script>
      const contract_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512";
      
      const get_products = async () => {
        const provider = new ethers.BrowserProvider(window.ethereum);
        const signer = await provider.getSigner();

        const contract = new ethers.Contract(contract_address, abi, signer);
        const products = await contract.get_products();

        const template = document.getElementById("productRowTemplate");
        const tbody = document.getElementById("productsList");

        tbody.innerHTML = "";

        products.forEach((product) => {
          const clone = template.content.cloneNode(true);

          clone.querySelector('.name').textContent = product.name;
          clone.querySelector('.desc').textContent = product.desc;
          clone.querySelector('.price').textContent = product.price.toString();
          clone.querySelector('.address').textContent = product.seller;
          clone.querySelector('.timestamp').textContent = product.timestamp.toString();
          clone.querySelector('.imgURL').src = product.imgURL;

          tbody.appendChild(clone);
        });
      }

      const add_product = async () => {
        const name = document.getElementById("name").value;
        const desc = document.getElementById("desc").value;
        const price = document.getElementById("price").value;
        const imgURL = document.getElementById("imgURL").value;

        const provider = new ethers.BrowserProvider(window.ethereum);
        const signer = await provider.getSigner();

        const contract = new ethers.Contract(contract_address, abi, signer);

        const tx = await contract.add_product(name, desc, price, imgURL);
        await tx.wait();

        document.getElementById("productForm").reset();
        get_products();
      };

      get_products();
    </script>
  </body>
</html>
